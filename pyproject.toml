[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "herdr-drafts"
version = "0.1.0"
description = "Draft, queue, and send prompts to your AI coding agents from a dedicated terminal panel."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["textual>=6.6,<7"]

[project.scripts]
herdr-drafts = "herdr_drafts.__main__:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.13", "mypy>=1.18"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/herdr_drafts"]
