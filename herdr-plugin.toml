id = "herdr-drafts"
name = "Herdr Queue"
version = "0.2.0"
description = "Draft, queue, and send prompts to your AI coding agents from a dedicated terminal panel."
min_herdr_version = "0.9.3"
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "install.sh"]

[[actions]]
id = "open"
title = "Ouvrir les brouillons"
contexts = ["pane"]
command = ["sh", "run.sh", "open"]

[[panes]]
id = "drafts"
title = "Brouillons"
placement = "split"
command = ["sh", "run.sh", "tui"]
